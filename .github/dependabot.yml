# As actions são fixadas por SHA de commit; o Dependabot mantém os SHAs
# atualizados. Sem ele, o pin congelaria as actions para sempre.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
