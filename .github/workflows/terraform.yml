name: Terraform EKS

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destruir a stack em vez de aplicar (economiza crédito do Learner Lab)"
        type: boolean
        default: false

concurrency:
  # Nunca dois applies simultâneos sobre o mesmo state.
  group: terraform-k8s-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  # main -> prod, homolog -> homolog
  TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # O Learner Lab entrega credenciais temporárias; o token é obrigatório
          # e expira junto com a sessão de 4h do lab.
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar se as credenciais do lab ainda são válidas
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::Credenciais AWS expiradas. Abra o Learner Lab, copie o bloco 'AWS CLI' de AWS Details e atualize os secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN."
            exit 1
          fi

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=infra-k8s/${TF_VAR_environment}/terraform.tfstate"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Comentar o plan no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = (process.env.PLAN || '').slice(0, 60000)
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — cluster EKS (\`${process.env.TF_VAR_environment}\`)\n\n<details><summary>Ver plano</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`
            })

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.destroy
        run: terraform destroy -input=false -auto-approve

      - name: Resumo do cluster
        if: github.event_name == 'push'
        run: |
          {
            echo "## Cluster EKS provisionado"
            echo ""
            echo "| Recurso | Valor |"
            echo "| --- | --- |"
            echo "| Cluster | \`$(terraform output -raw cluster_name)\` |"
            echo "| Versão | \`$(terraform output -raw cluster_version)\` |"
            echo "| Endpoint | \`$(terraform output -raw cluster_endpoint)\` |"
            echo "| VPC | \`$(terraform output -raw vpc_id)\` |"
            echo ""
            echo '```'
            terraform output -raw update_kubeconfig_command
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
