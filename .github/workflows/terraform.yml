name: Terraform EKS

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destruir a stack em vez de aplicar (economiza crédito do Learner Lab)"
        type: boolean
        default: false

concurrency:
  # Nunca dois applies simultâneos sobre o mesmo state.
  group: terraform-k8s-${{ github.ref_name }}
  cancel-in-progress: false

# Menor privilégio por padrão; o job declara o que precisa a mais
# (pull-requests: write para comentar o plan).
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  # main -> prod, homolog -> homolog
  TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # O Learner Lab entrega credenciais temporárias; o token é obrigatório
          # e expira junto com a sessão de 4h do lab.
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar se as credenciais do lab ainda são válidas
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::Credenciais AWS expiradas. Abra o Learner Lab, copie o bloco 'AWS CLI' de AWS Details e atualize os secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN."
            exit 1
          fi

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=infra-k8s/${TF_VAR_environment}/terraform.tfstate"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Comentar o plan no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = (process.env.PLAN || '').slice(0, 60000)
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — cluster EKS (\`${process.env.TF_VAR_environment}\`)\n\n<details><summary>Ver plano</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`
            })

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

      # Integração Kubernetes do New Relic: CPU, memória, pods, nós e eventos do
      # cluster. Instalada pelo pipeline, e não pelo Terraform, porque é o runner
      # do GitHub que alcança o API server do EKS. Não bloqueia a infraestrutura:
      # sem NEW_RELIC_LICENSE_KEY, é ignorada; se falhar, vira aviso.
      - name: Instalar integração Kubernetes do New Relic
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          if [ -z "$NEW_RELIC_LICENSE_KEY" ]; then
            echo "::notice::NEW_RELIC_LICENSE_KEY não configurado — integração Kubernetes ignorada."
            exit 0
          fi
          CLUSTER=$(aws ssm get-parameter --name "/oficina/${TF_VAR_environment}/eks/cluster_name" --query Parameter.Value --output text)
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo update newrelic
          # lowDataMode reduz a ingestão para caber com folga nos 100 GB gratuitos.
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --namespace newrelic --create-namespace \
            --set global.licenseKey="$NEW_RELIC_LICENSE_KEY" \
            --set global.cluster="$CLUSTER" \
            --set global.lowDataMode=true \
            --set newrelic-infrastructure.privileged=true \
            --set kube-state-metrics.enabled=true \
            --set nri-kube-events.enabled=true \
            --set newrelic-logging.enabled=true \
            --wait --timeout 10m
          kubectl get pods -n newrelic

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.destroy
        run: terraform destroy -input=false -auto-approve

      - name: Resumo do cluster
        if: github.event_name == 'push'
        # terraform-bin: o wrapper do setup-terraform (necessário para comentar o plan
        # no PR) acrescenta linhas extras à saída capturada por $(terraform output).
        run: |
          {
            echo "## Cluster EKS provisionado"
            echo ""
            echo "| Recurso | Valor |"
            echo "| --- | --- |"
            echo "| Cluster | \`$(terraform-bin output -raw cluster_name)\` |"
            echo "| Versão | \`$(terraform-bin output -raw cluster_version)\` |"
            echo "| Endpoint | \`$(terraform-bin output -raw cluster_endpoint)\` |"
            echo "| VPC | \`$(terraform-bin output -raw vpc_id)\` |"
            echo ""
            echo '```'
            terraform output -raw update_kubeconfig_command
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
